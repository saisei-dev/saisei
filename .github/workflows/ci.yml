name: CI

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system deps (capstone, SDL2)
        run: sudo apt-get update && sudo apt-get install -y libcapstone-dev libsdl2-dev pkg-config
      - name: Point the build at the system Capstone
        run: echo "SAISEI_CAPSTONE_LIB_DIR=$(dirname "$(find /usr/lib -name 'libcapstone.so*' | head -1)")" >> "$GITHUB_ENV"
      - name: Format check
        run: cargo fmt --all --check
      - name: Run tests
        run: cargo test --workspace
      - name: Auto-merge pull request
        if: ${{ success() }}
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'squash'
            })
