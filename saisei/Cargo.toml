[package]
name = "saisei"
version = "0.0.0"
edition = "2021"
description = "Saisei launcher CLI (new-game / build / run / play)."

[lib]
name = "saisei"
path = "src/lib.rs"

# The developer / automation tool. The player-facing app is the `saisei` binary
# (see saisei-player), which is also the one host that runs every game; this CLI
# builds bundles, drives a running game, and does the reverse-engineering work.
[[bin]]
name = "saisei-cli"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
# Crash-bundle dir-name / dos_open failure regexes.
regex = "1"
# forkpty/select for `saisei control`.
libc = "0.2"
# Screenshot crop/upscale.
image = { version = "0.25", default-features = false, features = ["png"] }
# `new-game <url>` downloads in-process — no curl. rustls (pure Rust, its own
# webpki root store), so there is no system OpenSSL or CA-bundle dependency.
ureq = "3"
# `new-game <zip>` extracts in-process — no unzip. Pure Rust; stored + deflate
# only, which is every zip a modern archive site serves.
zip = { version = "8", default-features = false, features = ["deflate"] }
