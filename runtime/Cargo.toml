# saisei-runtime — the game runtime: machine loop, JIT registry, DOS/BIOS/HW
# shims, SDL display. Exports a C ABI the rustc-compiled JIT chunks resolve
# against at dlopen. Built as: staticlib (the game link), cdylib (the shim
# unit tests dlopen isolated copies), rlib (crate dependents).
[package]
name = "saisei-runtime"
version = "0.0.0"
edition = "2021"

[features]
# Mirrors the C `-DFORCE_EXIT_AFTER_10S` smoke-test define (was injected via
# CFLAGS). Build with `--features force_exit_after_10s` to reproduce it.
force_exit_after_10s = []

[dependencies]
# Pure-Rust libc bindings (no clang) for the OS-layer ports: FILE*/DIR/stat/tm,
# fopen/fread/opendir/fnmatch/... The DOS file table (handles[]) holds libc
# FILE* owned by shims.c, so dos.rs must use the same libc FILE type.
libc = "0.2"

[build-dependencies]
# Build-time only: decodes + downscales the splash logo PNG into the raw RGB the
# display path embeds. Nothing image-related is linked into the runtime itself.
image = { version = "0.25", default-features = false, features = ["png"] }

[lib]
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"
# Unit tests run here for the parts that are pure functions of their own state —
# the emulated sound chips, the splash, the window title. Anything that needs a
# live machine (the shims, the dispatcher) is still tested end-to-end by running
# the game, and by the dlopen'd shim tests in saisei-jitc/tests.
#
# The chips are `static mut` globals, exactly as the guest sees them, so their
# tests must take a lock rather than run in parallel — see audio::opl2::tests.
test = true
doctest = false
